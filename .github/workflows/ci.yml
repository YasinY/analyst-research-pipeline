name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, test, coverage
        run: ./mvnw -B --no-transfer-progress clean verify
      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import csv
          for module in ['core', 'app']:
              rows = list(csv.DictReader(open(f'{module}/target/site/jacoco/jacoco.csv')))
              covered = sum(int(r['LINE_COVERED']) for r in rows)
              missed = sum(int(r['LINE_MISSED']) for r in rows)
              branches = sum(int(r['BRANCH_COVERED']) for r in rows)
              branches_missed = sum(int(r['BRANCH_MISSED']) for r in rows)
              print(f"{module}: lines {100 * covered / (covered + missed):.1f}%  branches {100 * branches / (branches + branches_missed):.1f}%")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-pipeline
          path: |
            app/target/research-pipeline.jar
            core/target/site/jacoco
            app/target/site/jacoco
