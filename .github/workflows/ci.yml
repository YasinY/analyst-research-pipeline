name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, test, coverage
        run: ./mvnw -B --no-transfer-progress clean verify
      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import csv
          for module in ['core', 'app']:
              rows = list(csv.DictReader(open(f'{module}/target/site/jacoco/jacoco.csv')))
              covered = sum(int(r['LINE_COVERED']) for r in rows)
              missed = sum(int(r['LINE_MISSED']) for r in rows)
              branches = sum(int(r['BRANCH_COVERED']) for r in rows)
              branches_missed = sum(int(r['BRANCH_MISSED']) for r in rows)
              print(f"{module}: lines {100 * covered / (covered + missed):.1f}%  branches {100 * branches / (branches + branches_missed):.1f}%")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-pipeline
          path: |
            app/target/research-pipeline.jar
            core/target/site/jacoco
            app/target/site/jacoco
      - name: Publish latest jar as a GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Built from ${{ github.sha }}. Download research-pipeline.jar, set ANTHROPIC_API_KEY or OPENAI_API_KEY, run: java -jar research-pipeline.jar --serve"
          prerelease: false
          files: app/target/research-pipeline.jar
